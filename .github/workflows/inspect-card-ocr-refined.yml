name: Inspect card OCR refined
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Japanese OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
          python -m pip install Pillow
      - name: Download registered card images
        run: python scripts/inspect_card_images.py
      - name: Compare OCR methods on all images
        run: python scripts/inspect_card_ocr_refined.py
      - name: Upload OCR comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-ocr-refined
          path: diagnostic_output/card_ocr_refined/
          if-no-files-found: warn
