name: Sync verified official Encore cards
on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: write
concurrency:
  group: encore-official-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read official card list
        run: python scripts/sync_official_cards.py
      - name: Commit verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official_cards.json data/new_card_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync verified Encore card data'
            git push
          fi
