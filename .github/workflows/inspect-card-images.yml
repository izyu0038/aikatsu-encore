name: Inspect card images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all registered front and back images (read-only)
        run: python scripts/inspect_card_images.py
      - name: Upload image samples and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-image-samples
          path: diagnostic_output/card_image_samples/
          if-no-files-found: warn
