name: Update official Aikatsu Encore data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official card list
        run: |
          if [ -f scripts/check_new_cards.py ]; then
            python scripts/check_new_cards.py
          else
            echo "scripts/check_new_cards.py not found; keeping current verified data."
          fi

      - name: Ensure official data file exists
        run: |
          mkdir -p data
          if [ ! -f data/official_cards.json ]; then
            printf '%s\n' '{"source":"https://dcd.aikatsu.com/encore/cardlist/","checkedAt":null,"cards":[]}' > data/official_cards.json
          fi

      - name: Commit detected data changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update official Aikatsu Encore data"
          git push
